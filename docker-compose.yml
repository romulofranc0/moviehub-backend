version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: moviehub_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: movie_tracker
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: moviehub_pma
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db
    restart: always

volumes:
  db_data:
